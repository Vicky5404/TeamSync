# FlowSync — complete local stack.
#
#   docker compose up -d --build                          # everything: http://localhost:8080
#   docker compose up -d postgres redis s3 mailpit        # infrastructure only (run API/web from source)
#   docker compose run --rm migrate                       # apply migrations (also runs automatically)
#   docker compose logs -f backend worker                 # structured JSON logs
#   docker compose down            # stop (keeps data)    ·   docker compose down -v   # stop + wipe data
#
# Services: web client (nginx, proxies /api and /ws) · backend API · worker · one-off migrations ·
# PostgreSQL · Redis (Valkey) · S3-compatible storage (SeaweedFS) · SMTP catcher (Mailpit).
# Every service has a health check; dependants start only once their dependencies are healthy.
#
# Host ports and the JWT secret can be overridden in a root `.env` file (see .env.example).
# The containers run the production images in NODE_ENV=development mode: plain-HTTP cookies,
# automatic bucket creation and Swagger UI. See docs/deployment.md for production settings.

name: flowsync

x-backend-env: &backend-env
  NODE_ENV: development
  LOG_LEVEL: info
  LOG_PRETTY: 'false'
  APP_URL: http://localhost:${WEB_PORT:-8080}
  PUBLIC_API_URL: /api/v1
  # The web client is served by the frontend container; 5173 allows `npm run dev` against this API.
  CORS_ORIGINS: http://localhost:${WEB_PORT:-8080},http://localhost:5173
  # One proxy hop (the frontend's nginx) — rate limits and audit logs see real client addresses.
  TRUST_PROXY: '1'
  SWAGGER_ENABLED: 'true'
  DATABASE_URL: postgresql://flowsync:flowsync@postgres:5432/flowsync?schema=public
  DATABASE_POOL_SIZE: '10'
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-only-secret-0123456789abcdefghij}
  COOKIE_SECURE: 'false'
  S3_BUCKET: flowsync
  S3_REGION: us-east-1
  S3_ENDPOINT: http://s3:9000
  # Presigned URLs must be reachable from the browser, not only from inside Docker.
  S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9000}
  S3_ACCESS_KEY_ID: flowsync
  S3_SECRET_ACCESS_KEY: flowsync-secret
  S3_FORCE_PATH_STYLE: 'true'
  MAIL_TRANSPORT: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  MAIL_FROM: FlowSync <no-reply@flowsync.dev>
  RUN_WORKERS_IN_API: 'false'

x-hardening: &hardening
  init: true
  read_only: true
  tmpfs: ['/tmp']
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped

services:
  # --- Application ----------------------------------------------------------------------
  frontend:
    build: { context: ./frontend }
    image: flowsync-web:local
    environment:
      API_UPSTREAM: http://backend:4000
      # Avatars and attachment previews are served from object storage via presigned URLs.
      CSP_IMG_SRC: http://localhost:${S3_PORT:-9000}
    ports: ['${WEB_PORT:-8080}:8080']
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  backend:
    build: { context: ./backend, target: api }
    image: flowsync-api:local
    environment: *backend-env
    ports: ['${API_PORT:-4000}:4000']
    depends_on: &app-dependencies
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      # Readiness: the API, PostgreSQL and Redis all respond.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *hardening

  worker:
    build: { context: ./backend, target: worker }
    image: flowsync-worker:local
    environment:
      <<: *backend-env
      WORKER_HEALTH_PORT: '4001'
    depends_on: *app-dependencies
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *hardening

  # One-off job: applies pending migrations, then exits (backend and worker wait for it).
  migrate:
    build: { context: ./backend, target: migrate }
    image: flowsync-migrate:local
    environment:
      DATABASE_URL: postgresql://flowsync:flowsync@postgres:5432/flowsync?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # --- Infrastructure ---------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: flowsync
      POSTGRES_PASSWORD: flowsync
      POSTGRES_DB: flowsync
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowsync -d flowsync']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Redis-compatible (BSD-licensed Redis fork); any Redis >= 6.2 works. BullMQ needs noeviction.
  redis:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['${REDIS_PORT:-6379}:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # S3-compatible object storage (the API creates the bucket on startup outside production).
  s3:
    image: chrislusf/seaweedfs:4.47
    command: >
      server -ip=s3 -ip.bind=0.0.0.0 -dir=/data -master.volumeSizeLimitMB=256 -volume.max=100
      -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ['${S3_PORT:-9000}:9000']
    volumes:
      - s3-data:/data
      - ./backend/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:9000/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Catches all outgoing email: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports: ['${SMTP_PORT:-1025}:1025', '${MAILPIT_UI_PORT:-8025}:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  s3-data:
